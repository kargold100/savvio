<head>

<!-- PWA / installability -->

<meta name="apple-mobile-web-app-capable" content="yes" />

<!-- Icons -->
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<script src="js/cloud.js?v=2026070402"></script>
<script src="js/app.js?v=2026070402"></script>

<script>
  // Registers the service worker so Savvio installs cleanly (Add to Home
  // Screen / TWA) and works offline after the first visit. Safe to no-op
  // on browsers without support.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
